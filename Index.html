<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Afghan Topup</title>
<style>
*{box-sizing:border-box;font-family:system-ui, sans-serif}
body{margin:0;background:#0A0A0A;color:#fff;padding-bottom:90px}
.flag{height:6px;display:flex}.flag div{flex:1}.b{background:#000}.r{background:#D32011}.g{background:#007A36}
.header{text-align:center;padding:24px 16px 10px;font-size:28px;font-weight:900;letter-spacing:1px}
.live{display:flex;justify-content:space-between;padding:8px 16px;background:#111;color:#00ff88;font-size:12px;border-top:1px solid #222;border-bottom:1px solid #222}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px}
.btn-op{padding:18px;border-radius:16px;text-align:center;font-weight:900;font-size:16px;cursor:pointer;transition:0.2s}
.btn-op.sel{outline:3px solid #fff;transform:scale(0.96)}
.roshan{background:#E53935;color:#fff}.awcc{background:#3B82F6;color:#fff}.etisalat{background:#6fbf8a;color:#fff}.mtn{background:#FCD86F;color:#000}.salaam{background:#2E6B4A;color:#fff;grid-column: span 2}
.amt-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}
.amt{background:#1E1E1E;border:1px solid #333;border-radius:16px;padding:18px;text-align:center;font-weight:800;cursor:pointer}
.amt small{display:block;font-size:12px;color:#6fbf8a;margin-top:4px}.amt.sel{background:#2A2A2A;border-color:#fff}
.phone-wrap{margin:16px;background:#1E1E1E;border-radius:16px;display:flex;overflow:hidden;border:1px solid #333}
.prefix{padding:16px;background:#2A2A2A;font-weight:800;display:flex;align-items:center;gap:6px;border-right:1px solid #333}
.phone-wrap input{flex:1;background:transparent;border:none;padding:16px;color:#fff;font-size:16px;outline:none}
.recharge{background:#fff;color:#000;margin:16px;padding:18px;border-radius:18px;text-align:center;font-weight:900;font-size:18px;cursor:pointer}
.bank{background:#111;border:2px solid #2E6B4A;border-radius:16px;margin:16px;padding:16px}
.lang{position:absolute;right:16px;top:34px;background:#1E1E1E;border:1px solid #333;border-radius:20px;padding:6px 12px;font-size:12px}
.page{display:none}.page.active{display:block}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid #222;display:flex;justify-content:space-around;padding:10px 0}
.bottom div{text-align:center;font-size:10px;color:#888}
.bottom div.active{color:#fff}
</style></head><body>
<div class="flag"><div class="b"></div><div class="r"></div><div class="g"></div></div>
<div style="position:relative"><div class="header">AFGHAN TOPUP 🇦🇫</div><div class="lang" onclick="changeL()">🌐 <span id="lt">EN</span></div></div>
<div class="live"><span id="lv1">● LIVE RATE - EURO</span
