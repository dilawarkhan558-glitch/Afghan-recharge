<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AFGHAN TOPUP</title>
<style>
body{margin:0;background:#121212;font-family:sans-serif;color:white}
.flag{height:90px;display:flex;flex-direction:column}
.flag div{flex:1}
.b{background:#000}.r{background:#D32011}.g{background:#007A36}
.t{text-align:center;padding:20px;font-size:28px;font-weight:900}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px}
.btn{border-radius:14px;padding:18px;text-align:center;font-weight:bold;cursor:pointer}
.ro{background:#FF1A1A}.aw{background:#1976FF}.et{background:#2EB872}.mt{background:#FFC93C;color:#000}.sa{background:#0A5C36;grid-column:span 2}
.amt{background:#1E1E1E;border:1px solid #333;border-radius:14px;padding:16px;text-align:center;cursor:pointer}
.phone-wrap{padding:16px}
.phone-box{display:flex;align-items:center;background:#1E1E1E;border:1px solid #333;border-radius:14px;overflow:hidden}
.prefix{background:#2a2a2a;padding:16px 14px;font-weight:bold;border-right:1px solid #333}
.phone-box input{flex:1;background:transparent;border:none;color:white;padding:16px;font-size:16px;outline:none}
.recharge{margin:16px;background:#00C853;color:#000;padding:16px;text-align:center;border-radius:14px;font-weight:900;font-size:18px;cursor:pointer}
</style>
</head>
<body>
<div class="flag"><div class="b"></div><div class="r"></div><div class="g"></div></div>
<div class="t">AFGHAN TOPUP 🇦🇫</div>

<div class="grid">
<div class="btn ro">ROSHAN</div><div class="btn aw">AWCC</div>
<div class="btn et">ETISALAT</div><div class="btn mt">MTN</div>
<div class="btn sa">SALAAM</div>
</div>

<div class="phone-wrap">
  <div class="phone-box">
    <div class="prefix">🇦🇫 +93</div>
    <input type="tel" id="phone" placeholder="700 123 456">
  </div>
</div>

<div class="grid">
<div class="amt">50 AFN</div><div class="amt">100 AFN</div>
<div class="amt">200 AFN</div><div class="amt">500 AFN</div>
</div>

<div class="recharge" onclick="doRecharge()">RECHARGE NOW</div>

<script>
function doRecharge(){
  let num = document.getElementById('phone').value.trim();
  if(num.startsWith('0')) num = num.substring(1);
  let full = '+93' + num;
  alert('Recharge to: ' + full);
}
</script>

</body></html>
