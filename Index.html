<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Afghan Topup</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #000000; color: #ffffff; font-family: sans-serif; }
  </style>
</head>
<body class="min-h-screen p-4 flex flex-col justify-between max-w-md mx-auto">

  <div>
    <!-- Title -->
    <h1 class="text-2xl font-bold text-center tracking-wider mb-3">
      AFGHAN TOPUP 🇦🇫
    </h1>

    <!-- Live Rate Banner -->
    <div class="bg-[#051c0c] border border-[#00e676] rounded-full py-1.5 px-3 text-[11px] text-[#00e676] text-center font-semibold mb-6 flex items-center justify-center gap-1.5">
      <span class="h-2 w-2 rounded-full bg-[#00e676] inline-block animate-pulse"></span>
      LIVE - 1 EUR = 88.20 AFN | afghantopup.support@gmail.com
    </div>

    <!-- Network Buttons Grid -->
    <div class="grid grid-cols-2 gap-3 mb-3">
      <button onclick="selectNetwork(this)" class="network-btn bg-[#ff3b30] text-white py-4 rounded-2xl font-bold text-lg border-2 border-transparent focus:border-white">ROSHAN</button>
      <button onclick="selectNetwork(this)" class="network-btn bg-[#3478f6] text-white py-4 rounded-2xl font-bold text-lg border-2 border-transparent focus:border-white">AWCC</button>
      <button onclick="selectNetwork(this)" class="network-btn bg-[#70d766] text-black py-4 rounded-2xl font-bold text-lg border-2 border-transparent focus:border-white">ETISALAT</button>
      <button onclick="selectNetwork(this)" class="network-btn bg-[#ffcc00] text-black py-4 rounded-2xl font-bold text-lg border-2 border-transparent focus:border-white">MTN</button>
    </div>

    <!-- Salaam Full Width -->
    <button onclick="selectNetwork(this)" class="network-btn w-full bg-[#1f633e] text-white py-4 rounded-2xl font-bold text-lg border-2 border-transparent focus:border-white mb-6">SALAAM</button>

    <!-- Select Amount (100 AFN Se Start) -->
    <div class="grid grid-cols-2 gap-3 mb-6">
      <div onclick="selectAmount(this)" class="amount-card bg-[#1c1c1e] border border-gray-800 rounded-2xl p-4 text-center cursor-pointer active:border-white">
        <div class="text-xl font-bold">100 AFN</div>
        <div class="text-xs text-[#00e676] font-semibold mt-1">€1.13</div>
      </div>
      <div onclick="selectAmount(this)" class="amount-card bg-[#1c1c1e] border border-gray-800 rounded-2xl p-4 text-center cursor-pointer active:border-white">
        <div class="text-xl font-bold">200 AFN</div>
        <div class="text-xs text-[#00e676] font-semibold mt-1">€2.26</div>
      </div>
      <div onclick="selectAmount(this)" class="amount-card bg-[#1c1c1e] border border-gray-800 rounded-2xl p-4 text-center cursor-pointer active:border-white">
        <div class="text-xl font-bold">500 AFN</div>
        <div class="text-xs text-[#00e676] font-semibold mt-1">€5.66</div>
      </div>
      <div onclick="selectAmount(this)" class="amount-card bg-[#1c1c1e] border border-gray-800 rounded-2xl p-4 text-center cursor-pointer active:border-white">
        <div class="text-xl font-bold">1000 AFN</div>
        <div class="text-xs text-[#00e676] font-semibold mt-1">€11.33</div>
      </div>
    </div>

    <!-- Phone Number Input -->
    <div class="flex bg-[#1c1c1e] rounded-2xl overflow-hidden border border-gray-800 mb-6">
      <div class="flex items-center gap-1 bg-[#2c2c2e] px-4 py-3 font-semibold text-gray-300">
        <span>🇦🇫</span>
        <span>+93</span>
      </div>
      <input type="tel" placeholder="700123456" class="w-full bg-transparent px-4 py-3 outline-none text-white font-mono placeholder-gray-600" />
    </div>

    <!-- Action Button -->
    <button class="w-full bg-white text-black font-extrabold py-4 rounded-2xl text-lg tracking-wide active:bg-gray-200">
      RECHARGE NOW → AZIZI BANK
    </button>
  </div>

  <!-- Footer Info (Updated WhatsApp Number) -->
  <div class="text-center text-xs text-gray-500 mt-8 space-y-1 pb-4">
    <p class="text-gray-400">WhatsApp: +39 351 212 1290</p>
    <p>Email: afghantopup.support@gmail.com</p>
    <p class="mt-2">© 2026 Afghan Topup - Milan, Italy</p>
  </div>

  <script>
    function selectNetwork(el) {
      document.querySelectorAll('.network-btn').forEach(b => b.classList.remove('ring-2', 'ring-white'));
      el.classList.add('ring-2', 'ring-white');
    }
    function selectAmount(el) {
      document.querySelectorAll('.amount-card').forEach(c => c.classList.remove('border-white'));
      el.classList.add('border-white');
    }
  </script>
</body>
</html>
