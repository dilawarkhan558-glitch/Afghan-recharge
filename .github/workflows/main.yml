name: Build Afghan APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APK from Index.html
        run: |
          npm install -g cordova
          cordova create AfghanApp com.afghan.topup AfghanTopup
          cp Index.html AfghanApp/www/index.html
          cd AfghanApp
          cordova platform add android@12
          cordova build android --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Afghan-Topup-APK-FINAL
          path: AfghanApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
