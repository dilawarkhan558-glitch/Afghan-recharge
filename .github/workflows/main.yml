name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Unzip
        run: |
          unzip -o "project (1).zip" -d.
          rm -f *.zip
          if [! -f package.json ]; then
            INNER=$(find. -maxdepth 3 -name package.json | head -1 | xargs dirname)
            echo "Found project in $INNER"
            cp -r $INNER/*. || true
          fi
          ls -la

      - name: Build Web
        run: |
          npm install
          npm run build

      - name: Build Android
        run: |
          rm -rf android
          npx cap add android
          npx cap copy android
          cd android
          chmod +x gradlew
         ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Afghan-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
