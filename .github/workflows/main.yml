name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Create Package.json If Missing
        run: |
          if [ ! -f "package.json" ]; then
            cat << 'EOF' > package.json
          {
            "name": "afghan-topup",
            "version": "1.0.0",
            "description": "Afghan Topup App",
            "main": "index.js",
            "scripts": {
              "test": "echo \"Error: no test specified\" && exit 1"
            },
            "dependencies": {}
          }
          EOF
          fi

      - name: Extract Only Web Files from Zip (Ignoring Android Junk)
        run: |
          mkdir -p temp_unzip www
          if [ -f "project (1).zip" ]; then
            unzip -o "project (1).zip" -d temp_unzip || true
          elif [ -f "project.zip" ]; then
            unzip -o "project.zip" -d temp_unzip || true
          fi
          
          # Zip ke andar se sirf index.html aur web assets dhoond kar www me daalo
          find temp_unzip -name "index.html" -exec cp -f {} www/index.html \; || true
          if [ -d "temp_unzip/www" ]; then cp -rf temp_unzip/www/* www/ || true; fi
          if [ -d "temp_unzip/dist" ]; then cp -rf temp_unzip/dist/* www/ || true; fi
          if [ -d "temp_unzip/build" ]; then cp -rf temp_unzip/build/* www/ || true; fi
          
          # Temporary unzip folder ko khatam karo
          rm -rf temp_unzip

      - name: Install Dependencies
        run: |
          npm install || true
          npm install @capacitor/android @capacitor/cli @capacitor/core @capacitor/browser || true

      - name: Setup Fresh Capacitor Android Project
        run: |
          rm -rf android
          rm -f capacitor.config.ts capacitor.config.js capacitor.config.json || true

          npx cap init "Afghan Topup" "com.afghantopup.app" --web-dir www
          npx cap add android
          npx cap sync android

          # Kisi bhi resource conflict ko root se khatam karne ke liye
          rm -f android/app/src/main/res/values/ic_launcher_background.xml || true
          rm -f android/app/src/main/res/drawable/ic_launcher_background.xml || true

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Afghan-APK
          path: android/app/build/outputs/apk/debug/**/*.apk
