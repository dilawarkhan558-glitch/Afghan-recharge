name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Unzip Project
        run: |
          ls -la
          unzip -o "project (1).zip" -d.
          rm -f "project (1).zip"
          rm -f project.zip
          # Agar files kisi folder ke andar hain to bahar nikalo
          if [! -f package.json ]; then
            for d in */; do
              if [ -f "$d/package.json" ]; then
                echo "Found in $d"
                mv "$d"/*. 2>/dev/null || true
                mv "$d"/.*. 2>/dev/null || true
                rmdir "$d" 2>/dev/null || true
                break
              fi
            done
          fi
          ls -la

      - name: Build
        run: |
          npm install
          npm run build
          npx cap add android
          npx cap copy android
          cd android
          chmod +x gradlew
         ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Afghan-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
