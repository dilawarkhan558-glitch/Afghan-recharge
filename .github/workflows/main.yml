name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unzip
        run: |
          unzip -o "project (1).zip" -d.
          rm -f *.zip
          ls -la
          if [! -f package.json ]; then
            for d in */; do
              if [ -f "$d/package.json" ]; then
                echo "Found in $d"
                cp -r $d/*.
                break
              fi
            done
          fi
          ls -la
      - name: Build
        run: |
          npm install
          npm run build
          rm -rf android
          npx cap add android
          npx cap copy android
          cd android
          chmod +x gradlew
         ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Afghan-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
