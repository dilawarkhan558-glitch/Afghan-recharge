name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - run: npm install
      
      # 1. Dist aur Capacitor Assets public directory me index.html force copy
      - run: |
          mkdir -p dist
          cp index.html dist/index.html
          
      - run: npx cap sync android
      
      # 2. Sync hone ke BAAD assets folder me naya index.html force replace
      - run: |
          mkdir -p android/app/src/main/assets/public
          cp -f index.html android/app/src/main/assets/public/index.html
          
      # 3. Duplicate Background error fix
      - run: rm -f android/app/src/main/res/values/ic_launcher_background.xml
      
      # 4. APK assemble
      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          
      - uses: actions/upload-artifact@v4
        with:
          name: Afghan-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
