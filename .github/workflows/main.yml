name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unzip
        run: |
          rm -rf temp
          unzip -o 'project (1).zip' -d temp
          ls -la temp
          cp -r temp/..
          INNER=$(find. -maxdepth 3 -name package.json | head -n 1)
          echo "Found $INNER"
          if [! -f./package.json ]; then
            DIR=$(dirname "$INNER")
            echo "Moving from $DIR"
            cp -rf "$DIR"/*./ 2>/dev/null || true
            cp -rf "$DIR"/../ 2>/dev/null || true
          fi
          rm -rf temp
          rm -f 'project (1).zip'
          ls -la
      - run: npm install
      - run: npm run build
      - run: rm -rf android && npx cap add android && npx cap copy android
      - run: cd android && chmod +x gradlew &&./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Afghan-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
