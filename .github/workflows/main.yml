name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Unzip Project
      - name: Unzip Project
        run: |
          if [ -f "project (1).zip" ]; then
            unzip -o "project (1).zip" -d .
          elif [ -f "project.zip" ]; then
            unzip -o "project.zip" -d .
          fi

      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/browser || true
          npm run build || true

      - name: Inject Clean HTML with Direct Bank Intent Fix
        run: |
          mkdir -p dist
          rm -rf dist/*
          cat << 'EOF' > dist/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
            <title>Afghan Topup</title>
            <style>
              * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
              body { background-color: #000000; color: #ffffff; min-height: 100vh; padding: 16px; display: flex; flex-direction: column; justify-content: space-between; max-width: 480px; margin: 0 auto; }
              h1 { font-size: 22px; font-weight: 800; text-align: center; letter-spacing: 1px; margin-bottom: 12px; margin-top: 10px; }
              .live-bar { background-color: #051c0c; border: 1px solid #00e676; border-radius: 999px; padding: 8px 12px; font-size: 11px; color: #00e676; font-weight: 600; text-align: center; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; }
              .pulse-dot { width: 8px; height: 8px; background-color: #00e676; border-radius: 50%; display: inline-block; }
              .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
              .net-btn { padding: 16px 8px; border-radius: 16px; font-weight: 800; font-size: 16px; border: 2px solid transparent; cursor: pointer; text-align: center; width: 100%; outline: none; }
              .net-btn.roshan { background-color: #ff3b30; color: #ffffff; }
              .net-btn.awcc { background-color: #3478f6; color: #ffffff; }
              .net-btn.etisalat { background-color: #70d766; color: #000000; }
              .net-btn.mtn { background-color: #ffcc00; color: #000000; }
              .net-btn.salaam { background-color: #1f633e; color: #ffffff; grid-column: span 2; margin-bottom: 12px; }
              .net-btn.selected { border-color: #ffffff !important; }
              .amount-card { background-color: #1c1c1e; border: 1px solid #2c2c2e; border-radius: 16px; padding: 14px; text-align: center; cursor: pointer; }
              .amount-card.selected { border-color: #ffffff; }
              .amt-title { font-size: 18px; font-weight: 700; }
              .amt-price { font-size: 12px; color: #00e676; font-weight: 600; margin-top: 4px; }
              .phone-box { display: flex; background-color: #1c1c1e; border: 1px solid #2c2c2e; border-radius: 16px; overflow: hidden; margin-top: 10px; margin-bottom: 20px; }
              .flag-code { background-color: #2c2c2e; padding: 12px 16px; font-weight: 600; color: #d1d5db; display: flex; align-items: center; gap: 6px; }
              .phone-input { width: 100%; background: transparent; border: none; padding: 12px 16px; outline: none; color: #ffffff; font-family: monospace; font-size: 16px; }
              .action-btn { width: 100%; background-color: #ffffff; color: #000000; font-weight: 800; padding: 16px; border-radius: 16px; border: none; font-size: 16px; cursor: pointer; letter-spacing: 0.5px; }
              .footer { text-align: center; font-size: 11px; color: #6b7280; margin-top: 24px; padding-bottom: 16px; line-height: 1.6; }
              .footer strong { color: #9ca3af; }
            </style>
          </head>
          <body>
            <div>
              <h1>AFGHAN TOPUP 🇦🇫</h1>
              <div class="live-bar" onclick="fetchLiveRate()">
                <span class="pulse-dot"></span>
                <span id="rateText">LIVE - 1 EUR = 72.50 AFN | Tap to Refresh</span>
              </div>
              <div class="grid-2">
                <button onclick="selectNet(this, 'Roshan')" class="net-btn roshan">ROSHAN</button>
                <button onclick="selectNet(this, 'AWCC')" class="net-btn awcc">AWCC</button>
                <button onclick="selectNet(this, 'Etisalat')" class="net-btn etisalat">ETISALAT</button>
                <button onclick="selectNet(this, 'MTN')" class="net-btn mtn selected">MTN</button>
                <button onclick="selectNet(this, 'Salaam')" class="net-btn salaam">SALAAM</button>
              </div>
              <div class="grid-2">
                <div onclick="selectAmt(this, 100)" class="amount-card selected">
                  <div class="amt-title">100 AFN</div>
                  <div class="amt-price" id="p100">€1.38</div>
                </div>
                <div onclick="selectAmt(this, 200)" class="amount-card">
                  <div class="amt-title">200 AFN</div>
                  <div class="amt-price" id="p200">€2.76</div>
                </div>
                <div onclick="selectAmt(this, 500)" class="amount-card">
                  <div class="amt-title">500 AFN</div>
                  <div class="amt-price" id="p500">€6.90</div>
                </div>
                <div onclick="selectAmt(this, 1000)" class="amount-card">
                  <div class="amt-title">1000 AFN</div>
                  <div class="amt-price" id="p1000">€13.79</div>
                </div>
              </div>
              <div class="phone-box">
                <div class="flag-code">🇦🇫 +93</div>
                <input type="tel" id="phoneNumber" placeholder="700123456" class="phone-input" />
              </div>
              <button onclick="proceedRecharge()" class="action-btn">RECHARGE NOW</button>
            </div>
            <div class="footer">
              <p><strong>WhatsApp: +39 351 212 1290</strong></p>
              <p>Email: afghantopup.support@gmail.com</p>
              <p style="margin-top: 6px;">© 2026 Afghan Topup - Milan, Italy</p>
            </div>
            <script>
              let currentRate = 72.50;
              let selectedNetworkName = 'MTN';
              let selectedAmountVal = 100;

              function selectNet(el, name) {
                var btns = document.querySelectorAll('.net-btn');
                for(var i=0; i<btns.length; i++) { btns[i].classList.remove('selected'); }
                el.classList.add('selected');
                selectedNetworkName = name;
              }

              function selectAmt(el, amount) {
                var cards = document.querySelectorAll('.amount-card');
                for(var i=0; i<cards.length; i++) { cards[i].classList.remove('selected'); }
                el.classList.add('selected');
                selectedAmountVal = amount;
              }

              function updatePrices() {
                document.getElementById('p100').innerText = '€' + (100 / currentRate).toFixed(2);
                document.getElementById('p200').innerText = '€' + (200 / currentRate).toFixed(2);
                document.getElementById('p500').innerText = '€' + (500 / currentRate).toFixed(2);
                document.getElementById('p1000').innerText = '€' + (1000 / currentRate).toFixed(2);
                document.getElementById('rateText').innerText = 'LIVE - 1 EUR = ' + currentRate.toFixed(2) + ' AFN | Tap to Refresh';
              }

              async function fetchLiveRate() {
                try {
                  document.getElementById('rateText').innerText = 'Updating Live Rate...';
                  let response = await fetch('https://api.exchangerate-api.com/v4/latest/EUR');
                  let data = await response.json();
                  if(data && data.rates && data.rates.AFN) {
                    currentRate = data.rates.AFN;
                  } else {
                    currentRate = 72.50;
                  }
                  updatePrices();
                } catch(e) {
                  currentRate = 72.50;
                  updatePrices();
                }
              }

              function proceedRecharge() {
                let phone = document.getElementById('phoneNumber').value.trim();
                if(!phone || phone.length < 9) {
                  alert('Please enter a valid mobile number!');
                  return;
                }
                let eurPrice = (selectedAmountVal / currentRate).toFixed(2);
                alert('Topup Request:\nNetwork: ' + selectedNetworkName + '\nNumber: +93 ' + phone + '\nAmount: ' + selectedAmountVal + ' AFN (€' + eurPrice + ')');
                
                let targetUrl = 'https://buy.stripe.com/YOUR_ACTUAL_PAYMENT_LINK_ID?client_reference_id=' + phone;
                
                if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Browser) {
                  window.Capacitor.Plugins.Browser.open({ url: targetUrl });
                } else {
                  window.open(targetUrl, '_system');
                }
              }

              updatePrices();
            </script>
          </body>
          </html>
          EOF

      - name: Sync Capacitor
        run: |
          npx cap sync android || true
          rm -f android/app/src/main/res/values/ic_launcher_background.xml || true

      - name: Enable External App Intents in AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i '/<\/application>/i \    <queries>\n        <intent>\n            <action android:name="android.intent.action.VIEW" />\n            <category android:name="android.intent.category.BROWSABLE" />\n            <data android:scheme="https" />\n        </intent>\n    </queries>' "$MANIFEST" || true
          fi

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # Flexible APK Search and Upload (Yeh line ab APK dhoond kar upload karegi)
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Afghan-APK
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/**/*.apk
            **/build/outputs/apk/debug/*.apk
