name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Unzip Project
        run: |
          if [ -f "project (1).zip" ]; then
            unzip -o "project (1).zip" -d .
          elif [ -f "project.zip" ]; then
            unzip -o "project.zip" -d .
          fi

      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/android @capacitor/cli @capacitor/core @capacitor/browser || true

      - name: Setup Web & Capacitor Android
        run: |
          npm run build || true
          
          mkdir -p www
          if [ -d "dist" ]; then
            cp -rf dist/* www/ || true
          elif [ -d "build" ]; then
            cp -rf build/* www/ || true
          elif [ -f "index.html" ]; then
            cp -f index.html www/index.html || true
          fi

          # Purani config files hatao taaki conflict na ho
          rm -f capacitor.config.ts capacitor.config.js capacitor.config.json || true
          rm -rf android

          npx cap init "Afghan Topup" "com.afghantopup.app" --web-dir www
          npx cap add android
          npx cap sync android
          rm -f android/app/src/main/res/values/ic_launcher_background.xml || true

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Afghan-APK
          path: android/app/build/outputs/apk/debug/**/*.apk
