name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      # 1. Zip extract karo
      - run: unzip -o 'project (1).zip' -d .
      
      # 2. ZIP ke andar wale React App.jsx ko naye Dark Theme UI se replace karo
      - run: |
          cat << 'EOF' > src/App.jsx
          import React, { useState } from 'react';

          export default function App() {
            const [selectedNetwork, setSelectedNetwork] = useState('MTN');
            const [selectedAmount, setSelectedAmount] = useState(100);

            const packages = [
              { afn: 100, eur: '1.13' },
              { afn: 200, eur: '2.26' },
              { afn: 500, eur: '5.66' },
              { afn: 1000, eur: '11.33' }
            ];

            return (
              <div style={{ backgroundColor: '#000', color: '#fff', minHeight: '100vh', padding: '16px', fontFamily: 'sans-serif', maxWidth: '480px', margin: '0 auto', display: 'flex', flexDirection: 'column', justifyContent: 'space-between' }}>
                <div>
                  <h1 style={{ fontSize: '22px', fontWeight: 'bold', textAlign: 'center', marginBottom: '12px' }}>AFGHAN TOPUP 🇦🇫</h1>

                  <div style={{ backgroundColor: '#051c0c', border: '1px solid #00e676', borderRadius: '999px', padding: '8px 12px', fontSize: '11px', color: '#00e676', textAlign: 'center', marginBottom: '20px' }}>
                    LIVE - 1 EUR = 88.20 AFN | afghantopup.support@gmail.com
                  </div>

                  <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px', marginBottom: '12px' }}>
                    <button onClick={() => setSelectedNetwork('ROSHAN')} style={{ padding: '16px', borderRadius: '16px', fontWeight: 'bold', border: selectedNetwork === 'ROSHAN' ? '2px solid white' : 'none', backgroundColor: '#ff3b30', color: '#fff' }}>ROSHAN</button>
                    <button onClick={() => setSelectedNetwork('AWCC')} style={{ padding: '16px', borderRadius: '16px', fontWeight: 'bold', border: selectedNetwork === 'AWCC' ? '2px solid white' : 'none', backgroundColor: '#3478f6', color: '#fff' }}>AWCC</button>
                    <button onClick={() => setSelectedNetwork('ETISALAT')} style={{ padding: '16px', borderRadius: '16px', fontWeight: 'bold', border: selectedNetwork === 'ETISALAT' ? '2px solid white' : 'none', backgroundColor: '#70d766', color: '#000' }}>ETISALAT</button>
                    <button onClick={() => setSelectedNetwork('MTN')} style={{ padding: '16px', borderRadius: '16px', fontWeight: 'bold', border: selectedNetwork === 'MTN' ? '2px solid white' : 'none', backgroundColor: '#ffcc00', color: '#000' }}>MTN</button>
                    <button onClick={() => setSelectedNetwork('SALAAM')} style={{ padding: '16px', borderRadius: '16px', fontWeight: 'bold', border: selectedNetwork === 'SALAAM' ? '2px solid white' : 'none', backgroundColor: '#1f633e', color: '#fff', gridColumn: 'span 2' }}>SALAAM</button>
                  </div>

                  <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px', marginBottom: '20px' }}>
                    {packages.map((item) => (
                      <div key={item.afn} onClick={() => setSelectedAmount(item.afn)} style={{ backgroundColor: '#1c1c1e', border: selectedAmount === item.afn ? '1px solid white' : '1px solid #2c2c2e', borderRadius: '16px', padding: '14px', textAlign: 'center' }}>
                        <div style={{ fontSize: '18px', fontWeight: 'bold' }}>{item.afn} AFN</div>
                        <div style={{ fontSize: '12px', color: '#00e676', marginTop: '4px' }}>€{item.eur}</div>
                      </div>
                    ))}
                  </div>

                  <div style={{ display: 'flex', backgroundColor: '#1c1c1e', border: '1px solid #2c2c2e', borderRadius: '16px', overflow: 'hidden', marginBottom: '20px' }}>
                    <div style={{ backgroundColor: '#2c2c2e', padding: '12px 16px', color: '#d1d5db' }}>🇦🇫 +93</div>
                    <input type="tel" placeholder="700123456" style={{ width: '100%', background: 'transparent', border: 'none', padding: '12px', outline: 'none', color: '#fff' }} />
                  </div>

                  <button style={{ width: '100%', backgroundColor: '#fff', color: '#000', fontWeight: 'bold', padding: '16px', borderRadius: '16px', border: 'none', fontSize: '16px' }}>RECHARGE NOW → AZIZI BANK</button>
                </div>

                <div style={{ textAlign: 'center', fontSize: '11px', color: '#6b7280', marginTop: '24px' }}>
                  <p style={{ color: '#9ca3af' }}>WhatsApp: +39 351 212 1290</p>
                  <p>Email: afghantopup.support@gmail.com</p>
                  <p style={{ marginTop: '4px' }}>© 2026 Afghan Topup - Milan, Italy</p>
                </div>
              </div>
            );
          }
          EOF

      # 3. Dependencies Install karo aur React Build banao
      - run: npm install
      - run: npm run build
      
      # 4. Capacitor Sync karo
      - run: npx cap sync android
      
      # 5. Duplicate Resource Fix
      - run: rm -f android/app/src/main/res/values/ic_launcher_background.xml
      
      # 6. Build APK
      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          
      - uses: actions/upload-artifact@v4
        with:
          name: Afghan-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
