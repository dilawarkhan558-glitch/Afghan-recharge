name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Unzip Project
        run: |
          if [ -f "project (1).zip" ]; then
            unzip -o "project (1).zip" -d .
          elif [ -f "project.zip" ]; then
            unzip -o "project.zip" -d .
          fi

      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/android @capacitor/cli @capacitor/core @capacitor/browser || true

      - name: Prepare Web Assets & Capacitor
        run: |
          npm run build || true
          
          mkdir -p www
          if [ -d "dist" ]; then
            cp -rf dist/* www/ || true
          elif [ -d "build" ]; then
            cp -rf build/* www/ || true
          fi

          if [ ! -f "www/index.html" ] && [ -f "index.html" ]; then
            cp -f index.html www/index.html || true
          fi

          if [ ! -f "www/index.html" ]; then
            cat << 'EOF' > www/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Afghan Topup</title>
          </head>
          <body>
            <h1>Afghan Topup</h1>
          </body>
          </html>
          EOF
          fi

          rm -f capacitor.config.ts capacitor.config.js || true

          if [ ! -f "capacitor.config.json" ]; then
            npx cap init "Afghan Topup" "com.afghantopup.app" --web-dir www
          fi

          if [ ! -d "android" ]; then
            npx cap add android
          fi
          
          npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Afghan-APK
          path: android/app/build/outputs/apk/debug/**/*.apk
