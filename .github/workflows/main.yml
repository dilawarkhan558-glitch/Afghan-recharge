name: Build Afghan APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare files
        run: |
          mkdir -p www
          if [ -f "Index.html" ]; then
            cp Index.html www/index.html
            echo "Found Index.html"
          else
            echo "<h1>Please create Index.html</h1>" > www/index.html
            echo "Created dummy - Index.html missing"
          fi
          ls -lh www/
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Afghan-Topup-APK
          path: www/
          if-no-files-found: warn
