name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Unzip Project
        run: |
          if [ -f "project (1).zip" ]; then
            unzip -o "project (1).zip" -d .
          elif [ -f "project.zip" ]; then
            unzip -o "project.zip" -d .
          fi

      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/android @capacitor/cli @capacitor/core @capacitor/browser || true

      - name: Sync Capacitor
        run: |
          # Zip ke andar ke android folder ko preserve karein aur sirf sync chalayein
          npx cap sync android || true

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Afghan-APK
          path: android/app/build/outputs/apk/debug/**/*.apk
