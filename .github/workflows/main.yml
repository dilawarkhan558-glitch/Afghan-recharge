name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Unzip project
        run: |
          unzip -o 'project (1).zip' -d temp_extract
          cp -rf temp_extract/..
          cp -rf temp_extract/*/*. 2>/dev/null || true
          cp -rf temp_extract/*. 2>/dev/null || true
          rm -rf temp_extract 'project (1).zip'
          ls -la
      - name: Install deps
        run: npm install
      - name: Build web
        run: npm run build
      - name: Add android
        run: rm -rf android
      - name: Init Capacitor
        run: npx cap add android
      - name: Copy web
        run: npx cap copy android
      - name: Build APK
        run: cd android && chmod +x gradlew &&./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Afghan-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
