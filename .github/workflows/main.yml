name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Unzip Project
      - name: Unzip Project
        run: |
          if [ -f "project (1).zip" ]; then
            unzip -o "project (1).zip" -d .
          elif [ -f "project.zip" ]; then
            unzip -o "project.zip" -d .
          fi

      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/browser || true
          npm run build || true

      - name: Inject Clean HTML with Direct Bank Intent Fix
        run: |
          mkdir -p dist
          rm -rf dist/*
          cat << 'EOF' > dist/index.html
