name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Unzip
        run: |
          unzip -o 'project (1).zip' -d.
          rm -f 'project (1).zip'
          ls -la
          if [! -f package.json ]; then
            FOUND=$(find. -maxdepth 4 -name package.json | head -n 1)
            echo "Found at $FOUND"
            DIR=$(dirname "$FOUND")
            cp -r "$DIR"/*. || true
            cp -r "$DIR"/.. 2>/dev/null || true
            ls -la
          fi

      - name: Install
        run: npm install

      - name: Build Web
        run: npm run build

      - name: Build APK
        run: |
          rm -rf android
          npx cap add android
          npx cap copy android
          cd android
          chmod +x gradlew
         ./gradlew assembleDebug

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Afghan-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
