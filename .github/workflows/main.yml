name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Unzip project
        run: |
          rm -rf temp_extract
          unzip -o 'project (1).zip' -d temp_extract
          ls -la temp_extract
          PKG=$(find temp_extract -name "package.json" | head -n 1)
          echo "Found $PKG"
          DIR=$(dirname "$PKG")
          cp -r $DIR/*.
          cp -r $DIR/.*. 2>/dev/null || true
          rm -rf temp_extract
          rm -f 'project (1).zip'
          ls -la

      - name: Install
        run: npm install

      - name: Build Web
        run: npm run build

      - name: Add Android
        run: |
          rm -rf android
          npx cap add android
          npx cap copy android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
         ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Afghan-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
