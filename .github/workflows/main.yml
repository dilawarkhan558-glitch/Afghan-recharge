name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - run: unzip -o 'project (1).zip' -d .
      
      - run: npm install
      - run: npm run build || true
      
      # Force Overwrite: Purana UI mita kar Naya HTML inject karna
      - run: |
          mkdir -p dist android/app/src/main/assets/public
          cp index.html dist/index.html
          cp index.html android/app/src/main/assets/public/index.html
          
      - run: npx cap sync android
      
      - run: rm -f android/app/src/main/res/values/ic_launcher_background.xml
      
      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          
      - uses: actions/upload-artifact@v4
        with:
          name: Afghan-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
