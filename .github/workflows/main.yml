name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build APK
        run: |
          sudo apt-get install -y unzip
          unzip -o "project (1).zip" -d temp_project
          mv temp_project/*/*. 2>/dev/null || mv temp_project/*. 2>/dev/null || mv temp_project/*.*. 2>/dev/null || true
          # Find package.json and move to root
          PKG=$(find. -name "package.json" -type f | head -1)
          DIR=$(dirname "$PKG")
          if [ "$DIR"!= "." ]; then
            cp -r $DIR/*.
            cp -r $DIR/.*. 2>/dev/null || true
          fi
          rm -rf temp_project
          rm -f *.zip
          ls -la
          npm install
          npm run build
          npx cap add android
          npx cap copy android
          cd android
          chmod +x gradlew
         ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Afghan-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
