
name: Afghan Topup Auto Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip findutils

      - name: Find and extract ZIP
        run: |
          ZIP=$(find . -type f -iname '*.zip' \
            ! -path './.git/*' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Repository mein ZIP file nahi mili."
            exit 1
          fi

          echo "ZIP found: $ZIP"
          mkdir -p extracted
          unzip -o "$ZIP" -d extracted

      - name: Locate app project
        run: |
          PROJECT=$(find extracted -type f \
            \( -name capacitor.config.json \
            -o -name capacitor.config.ts \
            -o -name capacitor.config.js \) \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT" ]; then
            PROJECT=$(find extracted -type f \
              -name package.json -print -quit |
              xargs -r dirname)
          fi

          if [ -z "$PROJECT" ]; then
            HTML=$(find extracted -type f \
              -name index.html -print -quit)

            if [ -z "$HTML" ]; then
              echo "ERROR: ZIP mein app files nahi mili."
              exit 1
            fi

            PROJECT=$(dirname "$HTML")
          fi

          echo "APP_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Project found: $PROJECT"

      - name: Setup Java and Node
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Prepare app
        run: |
          cd "$APP_DIR"

          if [ ! -f package.json ]; then
            npm init -y
          fi

          npm install @capacitor/core @capacitor/cli \
            @capacitor/android @capacitor/browser

          if [ ! -d www ]; then
            mkdir -p www
            if [ -f index.html ]; then
              cp index.html www/index.html
            fi
          fi

          if [ ! -f www/index.html ]; then
            echo "ERROR: www/index.html nahi mili."
            exit 1
          fi

      - name: Configure Capacitor
        run: |
          cd "$APP_DIR"

          if [ ! -f capacitor.config.json ] && \
             [ ! -f capacitor.config.ts ] && \
             [ ! -f capacitor.config.js ]; then
            cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.afghantopup.app",
            "appName": "Afghan Topup",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF
          fi

      - name: Prepare Android
        run: |
          cd "$APP_DIR"

          if [ ! -d android ]; then
            npx cap add android
          fi

          npx cap sync android

      - name: Build APK
        run: |
          cd "$APP_DIR"
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Afghan-Topup-APK
          path: "**/android/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
