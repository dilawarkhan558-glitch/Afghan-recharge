name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Unzip Project
        run: |
          if [ -f "project (1).zip" ]; then
            unzip -o "project (1).zip" -d .
          elif [ -f "project.zip" ]; then
            unzip -o "project.zip" -d .
          fi

      - name: Install & Setup Capacitor
        run: |
          npm install
          npm install @capacitor/android @capacitor/cli @capacitor/core @capacitor/browser || true
          rm -rf android
          npx cap init "Afghan Topup" "com.afghantopup.app" --web-dir www || true

      - name: Inject Clean HTML into WWW
        run: |
          mkdir -p www
          rm -rf www/*
          cat << 'EOF' > www/index.html
