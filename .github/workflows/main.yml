name: Build Afghan APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare files
        run: |
          ls -la
          mkdir -p www
          if [ -f "Index.html" ]; then cp Index.html www/index.html; echo "Index.html found"; else echo "Index.html NOT found"; ls *.html*; fi
          ls -lh www/
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Afghan-Topup-APK
          path: www/
