name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unzip and Build
        run: |
          sudo apt-get update && sudo apt-get install -y unzip
          echo "Unzipping project..."
          unzip -o "project (1).zip" -d. || unzip -o project.zip -d. || unzip -o *.zip -d.
          rm -f *.zip
          ls -la
          # Agar files ek andar wale folder me hain to bahar nikalo
          if [ -f "project/package.json" ]; then mv project/*. -f; fi
          if [ -f "project (1)/package.json" ]; then mv "project (1)"/*. -f; fi
          npm install
          npm run build
          npx cap add android || true
          npx cap copy android
          cd android
          chmod +x gradlew
         ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Afghan-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
